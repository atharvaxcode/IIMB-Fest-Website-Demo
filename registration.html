<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
  </head>
  <body>
    <header>
      <img
        src="https://www.iimb.ac.in/sites/default/files/inline-images/IIMB-Logo.png"
        alt="IIMB Logo"
        height="100"
        width="550"
      />
      <h1>IIMB Fest-2024</h1>
      <p>Welcome to the IIMB Fest-2024!</p>
      <nav>
        <a href="./index.html">Click here to go back</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>Registration Form</h2>
        <form action="Registration">
          <label for="Name">Name:</label>
          <input
            type="text"
            id="Name"
            name="Name"
            required
            minlength="2"
            maxlength="20"
          />
          <br />
          <br />
          <label for="Email">Email:</label>
          <input type="Email" id="Email" name="Email" required />
          <br />
          <br />
          <label for="Tshirt Size">Tshirt Size:</label>
          <select id="Tshirt Size" name="Tshirt Size" required>
            <option value="">--select ur option--</option>
            <option value="38">38</option>
            <option value="40">40</option>
            <option value="42">42</option>
            <option value="44">44</option>
          </select>
          <br />
          <br />
          <label for="checkbox">I agree to the terms and conditions</label>
          <input
            type="checkbox"
            id="checkbox"
            name="checkbox"
            value="checkbox"
          />
          <br />
          <br />
          <label for="male">Male</label>
          <input type="radio" id="male" name="gender" value="male" required />
          <label for="female">Female</label>
          <input
            type="radio"
            id="female"
            name="gender"
            value="female"
            required
          />
          <br />
          <br />
          <button type="submit">Submit</button>
        </form>
      </section>
    </main>
  </body>
</html>
